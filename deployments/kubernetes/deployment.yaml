apiVersion: apps/v1
kind: Deployment
metadata: {name: event-contract-quality-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: ecqg}}
  template:
    metadata: {labels: {app: ecqg}}
    spec:
      containers:
      - name: gateway
        image: example/event-contract-quality-gateway:latest
        ports: [{containerPort: 8080}]
        env: [{name: ECQG_ADDRESS, value: ':8080'}]
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
